services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fhir_integration
    ports:
      - "5434:5432"
    volumes:
      - fhir_db_data:/var/lib/postgresql/data

volumes:
  fhir_db_data:
